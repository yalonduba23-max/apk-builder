name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    # This container has Python 3.11, NDK r25b, SDK, Cython all pre-installed
    # and locked — it cannot pull Python 3.14
    container:
      image: kivy/buildozer:latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Fix permissions and root warning
        run: |
          sed -i 's/warn_on_root = 1/warn_on_root = 0/' buildozer.spec
          # Ensure home dirs exist with correct ownership
          mkdir -p /root/.buildozer /root/.gradle
          mkdir -p /github/home/.buildozer /github/home/.gradle
          chown -R root:root /github/home 2>/dev/null || true

      - name: Cache buildozer downloads
        uses: actions/cache@v4
        with:
          path: /root/.buildozer
          key: kivy-buildozer-${{ hashFiles('buildozer.spec') }}-v1
          restore-keys: kivy-buildozer-

      - name: Cache local build artefacts
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: kivy-local-${{ hashFiles('buildozer.spec') }}-v1
          restore-keys: kivy-local-

      - name: Build APK
        run: |
          buildozer -v android debug 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "Build exit code: $BUILD_EXIT"
          exit $BUILD_EXIT

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bughunter-debug
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
