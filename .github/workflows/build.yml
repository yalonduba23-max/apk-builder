name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            python3-pip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            build-essential ccache \
            libltdl-dev

      - name: Install buildozer
        run: |
          pip3 install --upgrade pip
          pip3 install buildozer

      - name: Patch warn_on_root
        run: sed -i 's/warn_on_root = 1/warn_on_root = 0/' buildozer.spec

      - name: Set JAVA_HOME to Java 17
        run: echo "JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64" >> $GITHUB_ENV

      - name: Cache ~/.buildozer (SDK, NDK, p4a)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-home-${{ hashFiles('buildozer.spec') }}-v2
          restore-keys: buildozer-home-

      - name: Cache .buildozer (local build artefacts)
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-local-${{ hashFiles('buildozer.spec') }}-v2
          restore-keys: buildozer-local-

      - name: Build APK
        env:
          # Force p4a to use Python 3.11 recipes by pointing at the correct tag
          P4A_PYTHON_VERSION: "3.11.9"
        run: buildozer -v android debug 2>&1 | tee build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bughunter-debug
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
