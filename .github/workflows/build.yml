name: Build APK
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf automake libtool libtool-bin \
            pkg-config m4 cmake build-essential \
            zlib1g-dev libffi-dev libssl-dev

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install cython==0.29.37 buildozer

      - name: Patch p4a libffi to skip autoreconf
        run: |
          P4A_PATH=$(python -c "import pythonforandroid; import os; print(os.path.dirname(pythonforandroid.__file__))")
          echo "p4a found at: $P4A_PATH"
          LIBFFI_RECIPE="$P4A_PATH/recipes/libffi/__init__.py"
          cat "$LIBFFI_RECIPE"
          sed -i 's/autoreconf -vif/echo skipping autoreconf/g' "$LIBFFI_RECIPE"
          find "$P4A_PATH/recipes/libffi/" -name "*.sh" -exec sed -i 's/autoreconf -vif/echo skipping autoreconf/g' {} \;
          echo "Patch applied."

      - name: Clean cache
        run: rm -rf ~/.buildozer

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
