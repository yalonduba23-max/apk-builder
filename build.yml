name: Build APK
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Fix Permissions and Build
        run: |
          # 1. Give root ownership to the home dir
          chown -R root /github/home
          
          # 2. Bypass root warning
          sed -i 's/warn_on_root = 1/warn_on_root = 0/' buildozer.spec
          
          # 3. CRITICAL: Wipe the old corrupted 3.14 cache
          rm -rf .buildozer
          
          # 4. Run build with verbose logging
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
