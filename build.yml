name: Build APK
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Fix Permissions and Build
        run: |
          # 1. Fix Permissions
          mkdir -p /github/home/.cache/pip
          chown -R root /github/home/.cache
          
          # 2. Force stable settings in spec
          sed -i 's/warn_on_root = 1/warn_on_root = 0/' buildozer.spec
          
          # 3. Clean any previous failed builds
          buildozer android clean
          
          # 4. Run the build
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
