name: Build APK
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Fix Permissions and Build
        run: |
          # Fix the home directory permission issue seen in your log
          chown -R root /github/home
          
          # Force settings
          sed -i 's/warn_on_root = 1/warn_on_root = 0/' buildozer.spec
          
          # VERY IMPORTANT: Delete the old corrupted build data
          rm -rf .buildozer
          
          # Run the build with full logs so we can see the exact error if it fails
          buildozer -v android debug
